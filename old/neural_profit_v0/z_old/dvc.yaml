stages:

  # ------------------------------------------------------------
  # Stage 00 – Raw data ingestion
  # ------------------------------------------------------------
  # - Descarga / ingesta de datos crudos
  # - Genera el parquet raw versionado por DVC
  # - Produce un summary básico de ingestión
  stage_00_raw_data_ingestion:
    cmd: python src/neural_profit/stages/stage_00_raw_data_ingestion.py
    deps:
    - src/neural_profit/stages/stage_00_raw_data_ingestion.py
    - data/source
    outs:
    - data/raw/mnq_raw.parquet
    metrics:
    - reports/stage_00_ingest_summary.json:
        cache: false     # Métrica liviana, se guarda en Git


  # ------------------------------------------------------------
  # Stage 01 – Intraday data preparation
  # ------------------------------------------------------------
  # - Normaliza zona horaria
  # - Filtra días hábiles NASDAQ
  # - Filtra horario de trading
  # - Elimina días incompletos o con gaps
  # - Genera dataset intradía limpio + summary de calidad
  stage_01_intraday_data_preparation:
    cmd: >-
      python src/neural_profit/stages/stage_01_intraday_data_preparation.py
      --in-raw-parquet data/raw/mnq_raw.parquet
      --out-parquet data/processed/mnq_intraday.parquet
      --report-summary reports/stage_01_dataset_prep_summary.json
    deps:
      # Script del stage
    - src/neural_profit/stages/stage_01_intraday_data_preparation.py

      # Output del stage_00 (input de este stage)
    - data/raw/mnq_raw.parquet
    outs:
      # Dataset procesado (artefacto pesado → DVC)
    - data/processed/mnq_intraday.parquet
    metrics:
      # Summary liviano de preparación del dataset
    - reports/stage_01_dataset_prep_summary.json:
        cache: false


  # ------------------------------------------------------------
  # Stage 02 – Data quality validation (Quality Gate)
  # ------------------------------------------------------------
  # Objetivo:
  # - Validación formal de la calidad del dataset intradía.
  # - Actúa como “quality gate”: si falla, corta el pipeline (exit code != 0).
  #
  # Valida (ejemplos):
  # - Duplicados por (date, timestamp)
  # - Gaps intradía (saltos > 1 minuto, o > umbral)
  # - Días incompletos (menos minutos que los esperados)
  # - %NaNs total y por columna
  # - Valores inválidos (high<low, close fuera de rango, volume<0, etc.)
  #
  # Input:
  # - data/processed/mnq_intraday.parquet
  #
  # Output / Artefactos:
  # - reports/data_validation.json (PASS/FAIL + métricas)
  #
  # DVC:
  # - Versiona reports/data_validation.json
  #
  # MLflow:
  # - Log de métricas + tag quality_pass

  stage_02_data_quality_validation:
    cmd: >-
      python src/neural_profit/stages/stage_02_data_quality_validation.py
      --input data/processed/mnq_intraday.parquet
      --output reports/stage_02_data_quality_report.json
      --expected-freq-seconds 60
      --expected-minutes-per-day 451
      --max-incomplete-days-ratio 0.01
      --max-gap-seconds 60
      --max-total-nan-ratio 0.001
      --max-col-nan-ratio 0.002
    deps:
      - data/processed/mnq_intraday.parquet
      - src/neural_profit/stages/stage_02_data_quality_validation.py
    outs:
      - reports/stage_02_data_quality_report.json

  # ------------------------------------------------------------
  # Stage 03a – Target investigation (empirical analysis)
  # ------------------------------------------------------------
  # - Analiza movimientos intradía por minuto
  # - Define deltas base / target / tail
  # - Define ventanas óptimas y stop empírico
  # - Genera artifact JSON (no modifica dataset)
  stage_03a_target_investigation:
    cmd: >-
      python src/neural_profit/stages/stage_03a_target_investigation.py
      --in-intraday-parquet data/processed/mnq_intraday.parquet
      --report-summary reports/stage_03a_target_investigation_summary.json
    deps:
      - data/processed/mnq_intraday.parquet
      - src/neural_profit/stages/stage_03a_target_investigation.py
    outs:
      - reports/stage_03a_target_investigation_summary.json

  # ------------------------------------------------------------
  # Stage 03b – Target definition (empirical analysis)
  # ------------------------------------------------------------
  # - Analiza movimientos intradía por minuto
  # - Define deltas base / target / tail
  # - Define ventanas óptimas y stop empírico
  # - Genera artifact JSON (no modifica dataset)
  stage_03b_target_definition:
    cmd: >-
      python src/neural_profit/stages/stage_03b_target_definition.py
      --in-intraday-parquet data/processed/mnq_intraday.parquet
      --in-stage03a-summary reports/stage_03a_target_investigation_summary.json
      --out-labeled-parquet data/processed/mnq_intraday_labeled.parquet
      --report-summary reports/stage_03b_target_definition_summary.json
    deps:
      - src/neural_profit/stages/stage_03b_target_definition.py
      - data/processed/mnq_intraday.parquet
      - reports/stage_03a_target_investigation_summary.json
    outs:
      - data/processed/mnq_intraday_labeled.parquet
      - reports/stage_03b_target_definition_summary.json


  stage_04_feature_engineering:
    cmd: >-
      python src/neural_profit/stages/stage_04_feature_engineering.py
      --in-labeled-parquet data/processed/mnq_intraday_labeled.parquet
      --out-features-parquet data/features/mnq_features_target.parquet
      --report-summary reports/stage_04_feature_engineering_summary.json
      --use-volume
      --dropna-policy any
      --enable-mlflow
    deps:
      - src/neural_profit/stages/stage_04_feature_engineering.py
      - data/processed/mnq_intraday_labeled.parquet
    outs:
      - data/features/mnq_features_target.parquet
    metrics:
      - reports/stage_04_feature_engineering_summary.json
  

  stage_05_time_aware_data_splitting:
    cmd: >-
      python src/neural_profit/stages/stage_05_time_aware_data_splitting.py
      --in-parquet data/features/mnq_features_target.parquet
      --in-schema-summary reports/stage_04_feature_engineering_summary.json
      --params-yaml params.yaml
      --out-train-parquet data/splits/mnq_train.parquet
      --out-valid-parquet data/splits/mnq_valid.parquet
      --out-test-parquet data/splits/mnq_test.parquet
      --out-splits-json data/splits/splits.json
      --report-summary reports/stage_05_time_aware_data_splitting_summary.json
    deps:
      - src/neural_profit/stages/stage_05_time_aware_data_splitting.py
      - data/features/mnq_features_target.parquet
      - reports/stage_04_feature_engineering_summary.json
      - params.yaml
    params:
      - stage_05.train_ratio
      - stage_05.valid_ratio
      - stage_05.expected_gap_minutes
    outs:
      - data/splits/mnq_train.parquet
      - data/splits/mnq_valid.parquet
      - data/splits/mnq_test.parquet
      - data/splits/splits.json
    metrics:
      - reports/stage_05_time_aware_data_splitting_summary.json:
          cache: false


  stage_06_window_scaling_seq2seq:
    cmd: >-
      python src/neural_profit/stages/stage_06_window_scaling_seq2seq.py
      --in-train data/splits/mnq_train.parquet
      --in-valid data/splits/mnq_valid.parquet
      --in-test  data/splits/mnq_test.parquet
      --in-stage04-summary reports/stage_04_feature_engineering_summary.json
      --in-stage03b-summary reports/stage_03b_target_definition_summary.json
      --out-windows-dir data/windows
      --out-scaled-dir data/windows/scaled
      --report-summary reports/stage_06_window_scaling_seq2seq_summary.json
    deps:
      - src/neural_profit/stages/stage_06_window_scaling_seq2seq.py
      - data/splits/mnq_train.parquet
      - data/splits/mnq_valid.parquet
      - data/splits/mnq_test.parquet
      - reports/stage_04_feature_engineering_summary.json
      - reports/stage_03b_target_definition_summary.json
      - params.yaml
    params:
      - stage_06.date_col
      - stage_06.horizons
      - stage_06.scaler_type
      - stage_06.timezone_str
      - stage_06.drop_feature_h60
      - stage_06.drop_feature_h90
    outs:
      - data/windows/windows_train_60.npz
      - data/windows/windows_valid_60.npz
      - data/windows/windows_test_60.npz
      - data/windows/windows_train_90.npz
      - data/windows/windows_valid_90.npz
      - data/windows/windows_test_90.npz
      - data/windows/scaled/windows_train_60_z.npz
      - data/windows/scaled/windows_valid_60_z.npz
      - data/windows/scaled/windows_test_60_z.npz
      - data/windows/scaled/windows_train_90_z.npz
      - data/windows/scaled/windows_valid_90_z.npz
      - data/windows/scaled/windows_test_90_z.npz
      - data/windows/scaled/scaler_60.pkl
      - data/windows/scaled/scaler_90.pkl
    metrics:
      - reports/stage_06_window_scaling_seq2seq_summary.json
